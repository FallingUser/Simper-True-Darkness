plugins {
	id 'fabric-loom' version '1.17-SNAPSHOT'
	id 'maven-publish'
}

base {
	archivesName = "[" + project.minecraft_version + "+]" + project.archives_base_name
}
version = project.mod_version + "-${project.supported_versions}"
group = project.maven_group

repositories {
	// Add repositories to retrieve artifacts from in here.
	// You should only use this when depending on other mods because
	// Loom adds the essential maven repositories to download Minecraft and libraries from automatically.
	// See https://docs.gradle.org/current/userguide/declaring_repositories.html
	// for more information about repositories.
	maven { url "https://maven.shedaniel.me/" }		//Cloth
	maven { url "https://api.modrinth.com/maven" }	//Modrinth
}

dependencies {
	// To change the versions see the gradle.properties file
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	mappings loom.officialMojangMappings()
	modImplementation "net.fabricmc:fabric-loader:${project.loader_version}"

	// Fabric API. This is technically optional, but you probably want it anyway.
	modImplementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_version}"

	//Config
	modApi("me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}") {
		exclude(group: "net.fabricmc.fabric-api")
	}
	//include "me.shedaniel.cloth:cloth-config-fabric:${project.cloth_config_version}"

	//Mod Menu
	modCompileOnly modRuntimeOnly ("maven.modrinth:modmenu:${project.mod_menu_version}"), {
		exclude(group: "net.fabricmc.fabric-api")
	}

	//Sodium
	modCompileOnly modRuntimeOnly ("maven.modrinth:sodium:${project.sodium_version}")
	//You must install it, or it will made a serious render problem.

	//JEI
	//modCompileOnly modRuntimeOnly ("maven.modrinth:jei:${project.jei_version}")

	//REI
	//modCompileOnly modRuntimeOnly ("maven.modrinth:rei:${project.rei_version}")

	//Architecture API
	//modCompileOnly modRuntimeOnly ("maven.modrinth:architectury-api:${project.architectury_api_version}")

	//AppleSkin
	//modCompileOnly modRuntimeOnly ("maven.modrinth:appleskin:${project.appleskin_version}")

	// Uncomment the following line to enable the deprecated Fabric API modules. 
	// These are included in the Fabric API production distribution and allow you to update your mod to the latest modules at a later more convenient time.

	// modImplementation "net.fabricmc.fabric-api:fabric-api-deprecated:${project.fabric_version}"
}

processResources {
	inputs.property "version", project.version

	filesMatching("fabric.mod.json") {
		expand "version": project.version
	}
}

tasks.withType(JavaCompile).configureEach {
	it.options.release = 21
}

java {
	// Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
	// if it is present.
	// If you remove this line, sources will not be generated.
	withSourcesJar()

	sourceCompatibility = JavaVersion.VERSION_21
	targetCompatibility = JavaVersion.VERSION_21
}
